
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Manage Newsletter | Joypur Tresors</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f5f0;
      color: #242424;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 460px;
      padding: 36px 28px;
      background: #fff;
      border: 1px solid #e8e2d8;
      border-radius: 12px;
      text-align: center;
    }
    h1 { font-size: 26px; margin: 0 0 12px; }
    p { line-height: 1.6; color: #555; }
    label {
      display: block;
      margin: 24px 0 8px;
      text-align: left;
      font-weight: bold;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: 0;
      border-radius: 6px;
      background: #233c35;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    #message { margin-top: 20px; }
    .turnstile-wrap { margin-top: 20px; }
    a { color: #233c35; }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js"
          async defer></script>
</head>
<body>
  <main>
    <h1>Manage Newsletter</h1>
    <p>
      Want to unsubscribe? Enter your email address.
      We'll send you a secure link to manage your subscription.
    </p>

    <form id="manageForm">
      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        maxlength="254"
        required
      >

      <div class="turnstile-wrap">
        <div
          class="cf-turnstile"
          data-sitekey="0x4AAAAAAFdqLsYkbZdk_Nsd">
        </div>
      </div>

      <button id="submitButton" type="submit">
        Send Unsubscribe Link
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p>
      <a href="/">Return to homepage</a>
    </p>
  </main>

  <script>
    const form = document.getElementById("manageForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (button.disabled) return;

      const email = document.getElementById("email")
        .value.trim();

      const captchaInput = form.querySelector(
        'input[name="cf-turnstile-response"]'
      );

      const captcha = captchaInput?.value || "";

      if (!captcha) {
        message.textContent =
          "Please complete the security verification.";
        return;
      }

      button.disabled = true;
      message.textContent = "Processing your request...";

      try {
        const response = await fetch(
          "/api/newsletter-manage",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email,
              turnstile_token: captcha
            })
          }
        );

        const data = await response.json();

        message.textContent = data.message ||
          data.error ||
          "Unable to process your request.";

      } catch {
        message.textContent =
          "Service temporarily unavailable. Please try again.";
      } finally {
        button.disabled = false;

        if (window.turnstile) {
          window.turnstile.reset();
        }
      }
    });
  </script>
</body>
</html>
